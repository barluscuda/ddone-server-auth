# Local development defaults only.
# Override these values for deployed environments.
app:
  debug: false
  port: 3000

database:
  host: localhost
  port: 5432
  name: ddone_auth
  username: postgres
  password: postgres
  sslmode: disable
  timezone: UTC
  connect_timeout: 10
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 15m
  log_sql: false

redis:
  host: localhost
  port: 6380
  username: ""
  password: ""
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_size: 10
  min_idle_conns: 2

cache:
  user_ttl: 5m
  user_session_list_ttl: 1m
  signing_keys_ttl: 1m

cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - GET
    - POST
    - OPTIONS
  allowed_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization
  exposed_headers: []
  allow_credentials: false
  max_age: 12h

auth:
  issuer: ddone-server-auth
  audience: ddone-clients
  access_token_ttl: 5m
  refresh_token_ttl: 720h
  login_session_ttl: 720h
  signing_key_rotation: 2160h
  signing_key_retention: 4320h
  session_cookie_name: ddone_session
  session_cookie_secure: false
  session_cookie_same_site: lax
  session_cookie_max_age: 720h
